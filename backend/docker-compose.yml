services:
  enmesh-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENMESH_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - ENMESH_DEVICE=cpu
      - CUDA_VISIBLE_DEVICES=
      - NVIDIA_VISIBLE_DEVICES=void
      - ENMESH_RESOLUTION=128
      - ENMESH_CHUNK_SIZE=4096
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped

volumes:
  model-cache:
